name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  sidecar:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Format check
        working-directory: sidecar
        run: |
          # gofmt -l exits 0 even when it lists files, so check explicitly.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            echo "Fix with: gofmt -w sidecar/"
            exit 1
          fi
      - name: Build all packages
        working-directory: sidecar
        run: go build ./...
      - name: Vet
        working-directory: sidecar
        run: go vet ./...
      - name: Test
        working-directory: sidecar
        run: go test ./...
      - name: Build sidecar binary
        run: bash scripts/build-sidecar.sh
      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: deckhand-sidecar-${{ matrix.os }}
          path: src-tauri/binaries/deckhand-sidecar*

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run version:check
      - run: bun run build

  # Installer packaging: .github/workflows/release.yml (on v* tags).
  # Local: bun run tauri:build → .dmg/.app (macOS) or .deb/AppImage (Linux).
